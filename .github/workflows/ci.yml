name: Test and release
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: just check
      - run: just test
      - run: just test-integration
      # Cross-platform builds belong in GitHub, not the local development loop.
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target test --output type=cacheonly .
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target release --output type=cacheonly .

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A failed lookup alone is not proof that a release is absent.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$GITHUB_REF_NAME" /tmp/release-tags; then
            echo 'This version already has a release; use a new version.' >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Verify the published index and images
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$ref" --raw > /tmp/manifest.json
          python3 - <<'PY'
          import json
          with open('/tmp/manifest.json') as f:
              manifest = json.load(f)
          platforms = {(m.get('platform', {}).get('os'), m.get('platform', {}).get('architecture')) for m in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY
          docker pull --platform linux/amd64 "$ref"
          TEST_IMAGE="$ref" bash tests/integration.sh
          docker pull --platform linux/arm64 "$ref"
          docker run --rm --platform linux/arm64 --network none \
            -e PROXY_HOSTNAMES=service.example.com -e PROXY_UPSTREAM=app:8080 \
            -e CLOUDFLARE_API_TOKEN=0000000000000000000000000000000000000000 "$ref" check
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          printf '%s\n' \
            'Verified image for linux/amd64 and linux/arm64. Set this in your .env:' \
            "\`PROXY_IMAGE=$IMAGE:$GITHUB_REF_NAME\`" \
            '' \
            "Optional digest pin: \`$IMAGE@$DIGEST\`" \
            '' \
            "[Quickstart and examples](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME#quickstart)." > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
